name: Proxima Fusion
description: >-
  Proxima Fusion is a Munich-based fusion energy company building the first
  generation of commercial fusion power plants using quasi-isodynamic (QI)
  stellarators. Spun out of the Max Planck Institute for Plasma Physics, the
  company is developing Stellaris, a stellarator power plant concept, with
  milestones that include a Stellarator Model Coil and an Alpha demonstration
  stellarator on the path to grid-scale fusion energy. Proxima Fusion is a
  privately held deep-tech startup and does not currently publish a public API,
  developer portal, SDK, or machine-readable API surface; this profile captures
  its identity and public web properties for the API Evangelist network.
